<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>¿Quieres ser mi novia?</title>
  <style>
    :root{
      --gap: 16px;
      --btn-size: clamp(48px, 7vh, 64px);
      --font-title: clamp(22px, 4.5vw, 36px);
      --font-btn: clamp(14px, 3.5vw, 18px);
    }
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(120% 120% at 50% 0%, #ffd6e7 0%, #ffeef6 35%, #fff 70%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #222;
      touch-action: none; /* facilita control de pointer en móvil */
    }
    .card {
      width: min(92vw, 520px);
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,.12);
      padding: clamp(16px, 4vw, 28px);
      text-align: center;
    }
    h1 {
      margin: 0 0 var(--gap) 0;
      font-size: var(--font-title);
      line-height: 1.2;
    }
    p {
      margin: 0 0 calc(var(--gap) * 1.5) 0;
      font-size: clamp(15px, 3.7vw, 18px);
      color: #555;
    }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap);
      justify-items: center;
      align-items: center;
      position: relative;
      min-height: 120px;
    }
    button {
      font-size: var(--font-btn);
      padding: 12px 22px;
      border-radius: 999px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform .08s ease, background .2s ease, color .2s ease, border-color .2s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none; /* importante para móvil */
    }
    #btn-si {
      background: #ff477e;
      color: #fff;
      border-color: #ff477e;
    }
    #btn-si:active { transform: scale(0.98); }
    #btn-no {
      background: #fff4f8;
      color: #ff477e;
      border-color: #ffb3c9;
      position: absolute; /* permite moverlo libremente dentro del contenedor */
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      will-change: transform, left, top;
    }
    .toast {
      margin-top: var(--gap);
      font-size: clamp(14px, 3.5vw, 16px);
      color: #2e7d32;
      min-height: 1.2em;
    }
    /* Resguardo para pantallas muy pequeñas */
    @media (max-width: 360px) {
      .buttons { min-height: 140px; }
    }
  </style>
</head>
<body>
  <main class="card" role="dialog" aria-labelledby="titulo">
    <h1 id="titulo">¿Quieres ser mi novia?</h1>
    <p>Aunque este todo feyo?.</p>
    <div class="buttons" id="zone" aria-live="polite">
      <button id="btn-si" aria-label="Sí">Sí 💖</button>
      <button id="btn-no" aria-label="No">No 😅</button>
    </div>
    <div class="toast" id="toast" aria-live="assertive"></div>
  </main>

  <script>
    const btnSi = document.getElementById('btn-si');
    const btnNo = document.getElementById('btn-no');
    const zone  = document.getElementById('zone');
    const toast = document.getElementById('toast');

    // Parámetros de evasión
    const SAFE_MARGINS = 10; // px respecto a los bordes del contenedor
    const FLEE_DISTANCE = 120; // px base de huida
    const NEAR_RADIUS = 110; // distancia para activar huida
    const MAX_ATTEMPTS = 24; // reintentos para encontrar posición válida

    // Utilidad: obtener rects relativos a la zona
    function getRelativeRect(el, parent) {
      const r = el.getBoundingClientRect();
      const p = parent.getBoundingClientRect();
      return { x: r.left - p.left, y: r.top - p.top, w: r.width, h: r.height };
    }

    // Mover el botón 'No' a una posición segura dentro de la zona
    function moveNoAway(fromX, fromY) {
      const zoneRect = zone.getBoundingClientRect();
      const noRect = getRelativeRect(btnNo, zone);

      // Vectores desde puntero hacia el botón
      const centerNoX = noRect.x + noRect.w / 2;
      const centerNoY = noRect.y + noRect.h / 2;
      const vx = centerNoX - (fromX - zoneRect.left);
      const vy = centerNoY - (fromY - zoneRect.top);
      const dist = Math.hypot(vx, vy) || 1;

      // Dirección opuesta normalizada
      let dx = vx / dist;
      let dy = vy / dist;

      // Distancia base + aleatorio
      const extra = 40 + Math.random() * 80;
      let step = FLEE_DISTANCE + extra;

      // Candidatos y límites internos
      const minX = SAFE_MARGINS;
      const minY = SAFE_MARGINS;
      const maxX = zoneRect.width - noRect.w - SAFE_MARGINS;
      const maxY = zoneRect.height - noRect.h - SAFE_MARGINS;

      // Punto inicial propuesto
      let targetX = noRect.x + dx * step;
      let targetY = noRect.y + dy * step;

      // Si cae fuera, probar direcciones aleatorias hasta MAX_ATTEMPTS
      let attempts = 0;
      while ((targetX < minX || targetX > maxX || targetY < minY || targetY > maxY) && attempts < MAX_ATTEMPTS) {
        const angle = Math.random() * Math.PI * 2;
        dx = Math.cos(angle);
        dy = Math.sin(angle);
        step = 80 + Math.random() * 180;
        targetX = noRect.x + dx * step;
        targetY = noRect.y + dy * step;
        attempts++;
      }

      // Clamp a los límites
      targetX = Math.min(Math.max(targetX, minX), maxX);
      targetY = Math.min(Math.max(targetY, minY), maxY);

      btnNo.style.left = `${targetX + noRect.w / 2}px`;
      btnNo.style.top  = `${targetY + noRect.h / 2}px`;
      btnNo.style.transform = 'translate(-50%, -50%)';
    }

    // Detectar cercanía con Pointer Events (soporta mouse, touch, stylus)
    function onPointerMove(e) {
      const zoneRect = zone.getBoundingClientRect();
      const noRect = getRelativeRect(btnNo, zone);

      const px = e.clientX;
      const py = e.clientY;

      // distancia desde el puntero al centro del botón 'No'
      const cx = zoneRect.left + noRect.x + noRect.w / 2;
      const cy = zoneRect.top  + noRect.y + noRect.h / 2;
      const d = Math.hypot(px - cx, py - cy);

      if (d < NEAR_RADIUS) {
        e.preventDefault(); // evita clicks fantasmas en touch
        moveNoAway(px, py);
      }
    }

    // Si alcanzan a tocar el 'No', que también huya antes del click real
    function onPointerOverNo(e) {
      e.preventDefault();
      moveNoAway(e.clientX, e.clientY);
    }

    // Evitar que el 'No' sea clickeable
    btnNo.addEventListener('pointerdown', onPointerOverNo, { passive: false });
    btnNo.addEventListener('pointerenter', onPointerOverNo, { passive: false });

    // Escuchar movimientos dentro de la zona
    zone.addEventListener('pointermove', onPointerMove, { passive: false });

    // También al acercar el dedo sin mover mucho (tap lento)
    zone.addEventListener('pointerdown', onPointerMove, { passive: false });

    // Acción del 'Sí'
    btnSi.addEventListener('click', () => {
      toast.textContent = '¡Sabía que dirías que sí! 💘';
      // Opcional: vibración suave en móviles compatibles
      if (navigator.vibrate) navigator.vibrate(60);
    });

    // Ajuste: si el layout cambia (rotación), recentrar 'No'
    addEventListener('resize', () => {
      const zr = zone.getBoundingClientRect();
      const br = btnNo.getBoundingClientRect();
      btnNo.style.left = `${zr.width / 2}px`;
      btnNo.style.top  = `${zr.height / 2}px`;
      btnNo.style.transform = 'translate(-50%, -50%)';
    });

    // Accesibilidad de teclado: si navegan con Tab y presionan Enter en 'No', aún huye
    btnNo.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        const zr = zone.getBoundingClientRect();
        moveNoAway(zr.left + zr.width / 2, zr.top + zr.height / 2);
      }
    });
  </script>
</body>
</html>
